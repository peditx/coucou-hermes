[package]
name = "coucou"
description = "Coucou for Linux — Mochi lives at the top of your screen"
authors = ["PeDitX"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "coucou_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
# 32 random bytes for an API_SERVER_KEY the user does not already have.
getrandom = "0.3"
# Secret Service (gnome-keyring / KWallet) with a kernel-keyring fallback.
keyring = { version = "3", features = ["linux-native-sync-persistent"] }
# SO_PEERCRED: the server verifies the hook is talking to this same user.
libc = "0.2"
